name: Aviso de caducidad — AEMET

# La clave de AEMET vive 3 meses y su alta lleva un reCAPTCHA: no se puede renovar sola. Este
# workflow existe para que la caducidad se sepa con semanas de antelación en vez de descubrirse
# el día que el boletín empieza a devolver 401.
on:
  schedule:
    # Cada día a las 07:10 UTC. Minuto no redondo para no coincidir con el pico de la hora en punto.
    - cron: "10 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  caducidad:
    name: ¿Hay que renovar la API key de AEMET?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Comprobar la caducidad (se lee del JWT, sin llamar a AEMET)
        id: check
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: |
          set +e
          salida="$(deno run --allow-env=AEMET_API_KEY scripts/check-aemet-key.ts 2>&1)"
          codigo=$?
          echo "$salida"
          campo() { printf '%s' "$salida" | sed -n "s/^$1=//p" | tail -1; }
          # El resumen es lo ÚNICO que va a leer un humano: las líneas maquinales se quedan fuera.
          {
            echo "resumen<<FIN"
            printf '%s\n' "$salida" | grep -Ev '^(estado|escalon|aviso_id)=' 
            echo "FIN"
          } >> "$GITHUB_OUTPUT"
          {
            echo "estado=$(campo estado)"
            echo "aviso_id=$(campo aviso_id)"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Abrir o actualizar el aviso
        if: steps.check.outputs.aviso_id != ''
        uses: actions/github-script@v7
        env:
          RESUMEN: ${{ steps.check.outputs.resumen }}
          AVISO_ID: ${{ steps.check.outputs.aviso_id }}
        with:
          script: |
            const titulo = 'Renovar la API key de AEMET';
            // La marca es la identidad del aviso, y la calcula el script (probado): lleva la fecha
            // de caducidad de ESTA clave, así que una clave renovada estrena avisos aunque el issue
            // del ciclo anterior siga abierto. Mientras la marca no cambie no hay nada nuevo que
            // contar, y nadie recibe otra notificación.
            const marca = `<!-- aemet-aviso:${process.env.AVISO_ID} -->`;
            const cuerpo = [
              'La credencial de AEMET necesita una renovación manual (su alta tiene reCAPTCHA).',
              '',
              '```',
              process.env.RESUMEN,
              '```',
              '',
              'Mientras tanto el módulo `weather` **degrada de forma explícita**: el boletín oficial',
              'deja de publicarse con su motivo, el resto de la meteorología (Open-Meteo) sigue, y',
              '`credential` en la respuesta de `/bulletin` dice lo mismo que este aviso.',
              '',
              'Este aviso se cierra solo en cuanto el secreto tenga una clave válida.',
            ].join('\n');
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'aemet-key',
            });
            if (abiertos.data.length > 0) {
              const numero = abiertos.data[0].number;
              // Paginado: con el issue lleno de comentarios humanos, una marca fuera de la primera
              // página se leería como «no avisado» y el aviso volvería a repetirse cada día.
              const previos = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: numero, per_page: 100,
              });
              const yaContado = previos.some((c) => (c.body ?? '').includes(marca))
                || (abiertos.data[0].body ?? '').includes(marca);
              if (yaContado) {
                core.info(`El aviso ${process.env.AVISO_ID} ya está en el issue #${numero}: no se repite.`);
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: numero, body: `${cuerpo}\n\n${marca}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, body: `${cuerpo}\n\n${marca}`, labels: ['aemet-key'],
              });
            }

      - name: Cerrar el aviso cuando la clave vuelve a ser válida
        # Solo con `valid`. Que falte la clave (`missing`) NO es motivo para cerrar un aviso de
        # renovación: un secreto borrado por accidente apagaría justo la alarma que lo delata.
        if: steps.check.outputs.estado == 'valid'
        uses: actions/github-script@v7
        env:
          RESUMEN: ${{ steps.check.outputs.resumen }}
        with:
          script: |
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'aemet-key',
            });
            for (const issue of abiertos.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: `Renovada. \`\`\`\n${process.env.RESUMEN}\n\`\`\`\n\nSe cierra solo; el próximo ciclo abrirá su propio aviso.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
            }
