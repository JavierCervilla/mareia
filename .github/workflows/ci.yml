name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  # Gate anti-slop determinista (skill code-anti-slop): preset ESLint + sonarjs sobre el TS del
  # monorepo, `.astro` incluidos desde T-09 (eslint-plugin-astro). Rojo = no merge.
  anti-slop:
    name: Anti-slop · ESLint + sonarjs + UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # Gate de UI (skill frontend-anti-slop, vendorizada): linter determinista de tipografía,
      # color y código de presentación. Escanea `.ts`/`.css` y NO `.astro`, así que el CSS de la
      # web vive en ficheros `.css` importados y no en bloques `<style>` de página — ver
      # `apps/web/design-brief.md` §8 (el brief que exige el paso 1 de la skill).
      - name: Gate de UI · anti-slop de frontend
        run: |
          bash .claude/skills/frontend-anti-slop/scripts/audit-anti-slop.sh packages/ui/src
          bash .claude/skills/frontend-anti-slop/scripts/audit-anti-slop.sh apps/web/src

      # Shell y Dockerfile (T-17). El repo tiene desde ahora un `.sh` que corre como PID 1 en una
      # imagen de producción y un Dockerfile que construye lo que se sirve en el dominio, y hasta
      # aquí lo único que los había mirado era una persona, una vez. Eso no es un gate.
      # Las dos herramientas van por imagen FIJADA para que local y CI corran exactamente lo mismo;
      # comprobado que saben fallar (un `[ "$1" = ]` y un `FROM alpine:latest` los ponen en rojo).
      - name: Shell · shellcheck -S error
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck:v0.10.0 \
            -S error $(git ls-files '*.sh')

      # Umbral por defecto de hadolint (falla desde `info`). Nuestro Dockerfile pasa limpio, entre
      # otras cosas porque fija las bases por digest.
      - name: Dockerfile · hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0-alpine hadolint - < apps/web/Dockerfile

  web:
    name: Web · build Astro + astro check + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      # `astro check`: diagnósticos de las páginas y del layout (props, tipos del frontmatter), que
      # `tsc --noEmit` no ve porque no entra en los `.astro`.
      - run: pnpm --filter web check
      - run: pnpm typecheck
      # Tests de los packages con el runner nativo de Node (type stripping de Node 22): sin
      # framework ni dependencias extra. En T-02 son los golden tests del motor de mareas.
      - run: pnpm test

  api:
    name: API · deno check + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # `--frozen`: si `deno.lock` no está al día, el job falla en vez de resolver dependencias
      # nuevas en silencio (el equivalente de `pnpm install --frozen-lockfile` del lado Node).
      - run: deno task check --frozen
      - run: deno task test --frozen

  # Pipeline de datos (data/pipeline). Sólo el camino OFFLINE: el motor de predicción armónica
  # contra la tabla publicada de velocidades y contra el fixture de la implementación de referencia,
  # más la validación de los JSON commiteados contra el schema station/v1 y contra el catálogo de
  # constituyentes que soporta el motor de producción. Regenerar el dataset (`make build`) necesita
  # red y no corre en CI a propósito: el dataset se commitea.
  data-pipeline:
    name: Datos · motor armónico + schema station/v1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/data/pipeline
    defaults:
      run:
        working-directory: data/pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data/pipeline/requirements.txt
      - run: pip install --requirement requirements.txt
      - run: python -m pytest tests -q
      - run: python run.py check

  # Gate del Guardián (skill security-gate): escalera determinista secretos → SAST → deps, con el
  # ruleset vendorizado en .claude/skills/security-gate/presets. Sin cloud: nada sale del runner.
  # NO se corre pnpm install a propósito: así la escalera no escanea node_modules (osv-scanner lee
  # el lockfile). Si aparecieran CVE PRE-EXISTENTES de transitivas, el ratchet honesto es añadir
  # --deps-advisory (secretos y SAST nunca degradan).
  security:
    name: Guardián · escalera de seguridad (secretos + SAST + deps)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      # Versión FIJADA: un escáner sin pin cambia de reglas entre dos ejecuciones del mismo commit,
      # y entonces el gate deja de ser determinista (rojo hoy, verde mañana, sin que nadie toque el
      # código). Subir el pin es un cambio deliberado, con su PR.
      - name: Instalar semgrep (pip)
        run: pipx install semgrep==1.175.0 || pip install --user semgrep==1.175.0

      - name: Instalar gitleaks (binario de release)
        run: |
          GL_VER="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Instalar osv-scanner (binario de release)
        run: |
          OSV_VER="1.9.2"
          curl -sSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VER}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Escalera de seguridad (skill security-gate)
        run: bash .claude/skills/security-gate/scripts/security-gate.sh .

  # Rol qa (skill qa-staging). En T-01 la UI es un hello: no hay recorridos Playwright todavía
  # (llegan en T-09+), así que el job comprueba la PRESENCIA del esqueleto y es informativo.
  qa:
    name: Guardián · QA (presencia del esqueleto)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Presencia del esqueleto de QA
        run: |
          set -e
          for f in .qa-staging .qa-staging-presets/qa-pages.json .qa-adversarial \
                   tests/e2e/fixtures/qa-bundle.ts tests/e2e/journeys/adversarial/README.md; do
            [ -e "$f" ] || { echo "FALTA $f"; exit 1; }
            echo "  OK $f"
          done
          echo "T-01: sin recorridos Playwright todavía (T-09+); este job es informativo."

  # Check de PRESENCIA del pase adversario (skill qa-adversarial): si el PR toca UI, exige informe
  # bien formado en docs/qa/. No juzga agresividad. Escape en el asunto del commit: [skip-adv].
  adversarial:
    name: Guardián · presencia del pase adversario
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          # El check diffea contra la base del PR: con fetch-depth 1 no hay base y degrada a fail-open.
          fetch-depth: 0
      - run: bash .claude/skills/qa-adversarial/scripts/adversarial-presence.sh
