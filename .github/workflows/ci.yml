name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  # Gate anti-slop determinista (skill code-anti-slop): preset ESLint + sonarjs sobre el TS del
  # monorepo, `.astro` incluidos desde T-09 (eslint-plugin-astro). Rojo = no merge.
  anti-slop:
    name: Anti-slop · ESLint + sonarjs + UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # Gate de UI (skill frontend-anti-slop, vendorizada): linter determinista de tipografía,
      # color y código de presentación. Escanea `.ts`/`.css` y NO `.astro`, así que el CSS de la
      # web vive en ficheros `.css` importados y no en bloques `<style>` de página — ver
      # `apps/web/design-brief.md` §8 (el brief que exige el paso 1 de la skill).
      - name: Gate de UI · anti-slop de frontend
        run: |
          bash .claude/skills/frontend-anti-slop/scripts/audit-anti-slop.sh packages/ui/src
          bash .claude/skills/frontend-anti-slop/scripts/audit-anti-slop.sh apps/web/src

      # Shell y Dockerfile (T-17). El repo tiene desde ahora un `.sh` que corre como PID 1 en una
      # imagen de producción y un Dockerfile que construye lo que se sirve en el dominio, y hasta
      # aquí lo único que los había mirado era una persona, una vez. Eso no es un gate.
      # Las dos herramientas van por imagen FIJADA para que local y CI corran exactamente lo mismo;
      # comprobado que saben fallar (un `[ "$1" = ]` y un `FROM alpine:latest` los ponen en rojo).
      # `-z` + `xargs -0` y no `$(git ls-files …)` sin comillas: eso último lo cazó actionlint
      # (SC2046) al instalarlo en T-15, y tenía razón — un `.sh` con un espacio en la ruta se
      # parte en dos argumentos y shellcheck acaba mirando ficheros que no existen. Medido: sale
      # con **exit 2** y «openBinaryFile: does not exist», no en verde. O sea que el gate no se
      # callaba: **fallaba diciendo otra cosa**, y el fichero que dice lintar no lo lintaba nunca.
      # Un rojo por el motivo equivocado tampoco es un gate: manda a arreglar lo que no está roto.
      - name: Shell · shellcheck -S error
        run: |
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty \
            docker run --rm -i -v "$PWD:/repo" -w /repo koalaman/shellcheck:v0.10.0 -S error

      # Peldaño que faltaba desde T-17: los workflows son código de CI y hasta hoy no los miraba
      # nadie. La imagen trae shellcheck dentro, así que de paso revisa los bloques `run:`, que es
      # shell que corre en cada PR y que el `shellcheck` de arriba **no** ve (no son ficheros `.sh`).
      # Versión fijada por lo mismo que semgrep: un linter sin pin cambia de reglas entre dos
      # corridas del mismo commit y deja de ser determinista.
      - name: Workflows · actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      # Umbral por defecto de hadolint (falla desde `info`). Los dos Dockerfiles pasan limpios,
      # entre otras cosas porque fijan las bases por digest.
      - name: Dockerfiles · hadolint
        run: |
          for f in apps/web/Dockerfile apps/api/Dockerfile; do
            echo "--- $f"
            docker run --rm -i hadolint/hadolint:v2.12.0-alpine hadolint - < "$f"
          done

  web:
    name: Web · build Astro + astro check + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      # `astro check`: diagnósticos de las páginas y del layout (props, tipos del frontmatter), que
      # `tsc --noEmit` no ve porque no entra en los `.astro`.
      - run: pnpm --filter web check
      - run: pnpm typecheck
      # Tests de los packages con el runner nativo de Node (type stripping de Node 22): sin
      # framework ni dependencias extra. En T-02 son los golden tests del motor de mareas.
      - run: pnpm test

  api:
    name: API · deno check + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # `--frozen`: si `deno.lock` no está al día, el job falla en vez de resolver dependencias
      # nuevas en silencio (el equivalente de `pnpm install --frozen-lockfile` del lado Node).
      - run: deno task check --frozen
      - run: deno task test --frozen

      # El canal del OPERADOR (T-18/R-1). `scripts/check-aemet-key.ts` es lo que el humano acaba
      # leyendo dentro de un issue de GitHub cuando la clave de AEMET caduca, y hasta ahora no lo
      # alcanzaba ningún job: `pnpm test` no lo ve (es Deno) y el `deno task test` de arriba corre
      # sólo sobre `apps/api/src/`. El pase adversario midió el agujero mutando dos líneas del
      # script —el issue quedaba en «hace falta acción humana» sin variable, sin URL y sin los tres
      # pasos— con la suite entera en verde. Los recorridos EJECUTAN el script, no importan su
      # lógica: probar la función y no el artefacto es justo el fallo que esto cierra.
      - name: Canal del operador · el script de aviso de AEMET
        working-directory: scripts
        run: |
          deno task check
          deno task test

  # Pipeline de datos (data/pipeline). Sólo el camino OFFLINE: el motor de predicción armónica
  # contra la tabla publicada de velocidades y contra el fixture de la implementación de referencia,
  # más la validación de los JSON commiteados contra el schema station/v1 y contra el catálogo de
  # constituyentes que soporta el motor de producción. Regenerar el dataset (`make build`) necesita
  # red y no corre en CI a propósito: el dataset se commitea.
  data-pipeline:
    name: Datos · motor armónico + schema station/v1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/data/pipeline
    defaults:
      run:
        working-directory: data/pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data/pipeline/requirements.txt
      - run: pip install --requirement requirements.txt
      # Gate anti-slop del lado Python (skill code-anti-slop, reglas en data/pipeline/ruff.toml).
      # Va aquí y no en el job `anti-slop` porque ese instala Node y no Python, y porque el linter
      # del pipeline se pinnea en el mismo `requirements.txt` que el resto de sus dependencias.
      # T-13 lo añadió tras meter ~1.200 líneas de Python que ningún linter miraba mientras el
      # TypeScript pasaba por dos.
      - run: ruff check .
      - run: python -m pytest tests -q
      - run: python run.py check

  # Gate del Guardián (skill security-gate): escalera determinista secretos → SAST → deps, con el
  # ruleset vendorizado en .claude/skills/security-gate/presets. Sin cloud: nada sale del runner.
  # NO se corre pnpm install a propósito: así la escalera no escanea node_modules (osv-scanner lee
  # el lockfile). Si aparecieran CVE PRE-EXISTENTES de transitivas, el ratchet honesto es añadir
  # --deps-advisory (secretos y SAST nunca degradan).
  security:
    name: Guardián · escalera de seguridad (secretos + SAST + deps)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      # Versión FIJADA: un escáner sin pin cambia de reglas entre dos ejecuciones del mismo commit,
      # y entonces el gate deja de ser determinista (rojo hoy, verde mañana, sin que nadie toque el
      # código). Subir el pin es un cambio deliberado, con su PR.
      - name: Instalar semgrep (pip)
        run: pipx install semgrep==1.175.0 || pip install --user semgrep==1.175.0

      - name: Instalar gitleaks (binario de release)
        run: |
          GL_VER="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Instalar osv-scanner (binario de release)
        run: |
          OSV_VER="1.9.2"
          curl -sSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VER}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Escalera de seguridad (skill security-gate)
        run: bash .claude/skills/security-gate/scripts/security-gate.sh .

  # Rol qa (skill qa-staging). Comprueba la PRESENCIA del esqueleto; los recorridos de verdad los
  # corre el job `e2e`, que sí es gate duro.
  qa:
    name: Guardián · QA (presencia del esqueleto)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Presencia del esqueleto de QA
        run: |
          set -e
          for f in .qa-staging .qa-staging-presets/qa-pages.json .qa-adversarial \
                   tests/e2e/fixtures/qa-bundle.ts tests/e2e/journeys/adversarial/README.md; do
            [ -e "$f" ] || { echo "FALTA $f"; exit 1; }
            echo "  OK $f"
          done

  # Recorridos Playwright (T-11): los estados de la sección meteo contra el sitio CONSTRUIDO, con el
  # API servido desde los fixtures capturados. **Cero red en el recorrido**: el propio spec cierra la
  # salida a internet y afirma que los únicos orígenes externos que la página pide son los conocidos.
  # La descarga del navegador sí usa red — es toolchain, no la aplicación bajo prueba.
  e2e:
    name: QA · recorridos Playwright (sección meteo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los recorridos atacan `dist/`, no un servidor de desarrollo: hay que construir antes.
      - run: pnpm --filter web build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Las capturas de cada estado son el material del informe del pase adversario. No se
      # versionan (el .gitignore deja fuera los artefactos de QA); se suben aquí.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-meteo
          path: |
            qa-shots/
            qa-bundles/
          if-no-files-found: ignore

  # Check de PRESENCIA del pase adversario (skill qa-adversarial): si el PR toca UI, exige informe
  # bien formado en docs/qa/. No juzga agresividad. Escape en el asunto del commit: [skip-adv].
  adversarial:
    name: Guardián · presencia del pase adversario
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          # El check diffea contra la base del PR: con fetch-depth 1 no hay base y degrada a fail-open.
          fetch-depth: 0
      - run: bash .claude/skills/qa-adversarial/scripts/adversarial-presence.sh
