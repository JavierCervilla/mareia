name: Rebuild diario de la web

# El sitio es SSG: se construye una vez y publica **el día en que se construyó**, horneado en el
# HTML de las 192 páginas. Sin este workflow, `mareia.cervilla.es` se queda congelado en el día del
# último despliegue y va envejeciendo sin decirlo, que es exactamente el dato caducado con pinta de
# fresco que el proyecto existe para no publicar.
#
# **De qué depende esto, y qué depende de esto**:
#
# - depende del `ARG BUILD_DATE` de `apps/web/Dockerfile` (T-17) y de que se le pase **explícito**.
#   No basta con redesplegar: el `RUN` que escribe la fecha es una capa de Docker y, con el mismo
#   commit y sin build arg, se reutiliza de caché — el sitio volvería a publicar el día de ayer con
#   un despliegue nuevo y verde. Por eso este workflow escribe `BUILD_DATE` antes de desplegar.
# - de esto depende la **normativa fechada de T-19** (vedas y tallas mínimas), que está pensada para
#   **degradar cuando envejece**. Un dato que degrada con el tiempo sobre un sitio que no se
#   reconstruye nunca degrada: se queda para siempre en el día en que se construyó, diciendo que
#   está fresco. Si este workflow se apaga, T-19 deja de cumplir su promesa **en silencio**.

on:
  schedule:
    # 04:20 UTC: bien entrado el día UTC (el `BUILD_DATE` es UTC) y en un minuto no redondo, para
    # no caer en el pico de la hora en punto de los runners.
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-diario
  cancel-in-progress: false

jobs:
  rebuild:
    name: Reconstruir y redesplegar la web con la fecha de hoy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_WEB_APP_ID: ${{ secrets.DOKPLOY_WEB_APP_ID }}
      SITIO: https://mareia.cervilla.es
      # Una página de puerto, no la portada: lleva `data-otro-dia-build`, que es una marca puesta
      # a propósito para ser leída por una máquina, no un texto de la interfaz que cambia de forma
      # el día que alguien rediseñe la portada.
      PAGINA_TESTIGO: /mareas/galicia/pontevedra/vigo/
    steps:
      - name: Comprobar que el workflow está configurado
        # Sin las credenciales esto NO puede pasar en verde y callado: un rebuild que no corre es
        # invisible —el sitio sigue en pie, solo que con la fecha de otro día—, así que la única
        # señal posible es este job en rojo. Misma doctrina que el comprobador de la clave de AEMET.
        run: |
          faltan=""
          for s in DOKPLOY_API_URL DOKPLOY_API_KEY DOKPLOY_WEB_APP_ID; do
            eval "valor=\${$s}"
            [ -n "$valor" ] || faltan="$faltan $s"
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos del repositorio:$faltan — mientras falten, el sitio publica la fecha del último despliegue manual y la normativa fechada de T-19 no puede degradar."
            exit 1
          fi

      - name: La fecha de hoy, en UTC
        id: fecha
        run: echo "hoy=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Escribir BUILD_DATE en los build args de la aplicación
        env:
          HOY: ${{ steps.fecha.outputs.hoy }}
        run: |
          set -eu
          # Se leen los build args que ya hay y se sustituye SOLO la línea de BUILD_DATE: mandar el
          # campo entero a ciegas borraría `SITE_URL` o cualquier otro que alguien haya puesto en el
          # panel, y el estropicio no se notaría hasta el siguiente despliegue.
          # `application.one`, NO `application.byId`: la tabla de la skill documenta `byId` y ese
          # endpoint **no existe** — devuelve 404. Medido contra el panel real el 2026-08-29 al
          # desplegar el API. Es la TERCERA vez que esa tabla engaña en un día (antes fue PATCH por
          # POST), y esta vez engañó también al verificador, que me corrigió desde `one` hacia `byId`
          # razonando desde el documento. Con `byId` este workflow habría muerto en el primer curl.
          #
          # ANTES de tocar nada se guarda la ficha entera. `application.update` se asume
          # **parcial** —mandamos solo `{applicationId, buildArgs}`— y esa asunción NO está probada
          # contra el panel real. Si fuera un **reemplazo**, esta llamada dejaría la aplicación viva
          # sin dominio, sin sus variables de entorno (AEMET_API_KEY) y sin `dockerContextPath`, que
          # es justo el campo sin el cual el build falla. Y la confirmación de más abajo pasaría en
          # VERDE, porque `buildArgs` contendría exactamente lo que acabamos de mandar: se comprueba
          # lo que se envió, que es el peor sitio donde mirar. Así que se guarda la ficha y se
          # compara después campo a campo.
          antes="$(curl -sSf -H "x-api-key: $DOKPLOY_API_KEY" \
            "$DOKPLOY_API_URL/api/application.one?applicationId=$DOKPLOY_WEB_APP_ID")"
          actuales="$(printf '%s' "$antes" | jq -r '.buildArgs // ""')"
          nuevos="$(printf '%s\n' "$actuales" | grep -v '^BUILD_DATE=' || true)"
          nuevos="$(printf '%s\nBUILD_DATE=%s\n' "$nuevos" "$HOY" | sed '/^$/d')"
          jq -n --arg id "$DOKPLOY_WEB_APP_ID" --arg args "$nuevos" \
            '{applicationId: $id, buildArgs: $args}' > /tmp/actualizacion.json
          # POST, no PATCH. La tabla de la skill de dokploy decía `PATCH` y se contradecía con su
          # propio ejemplo; el heartbeat del 2026-08-21 ya lo tenía medido en campo: con PATCH la
          # llamada devuelve otra cosa y **no aplica**. Es decir, este rebuild no habría corrido
          # nunca, y la normativa fechada que depende de él se habría quedado sin su pieza.
          curl -sSf -X POST -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            --data @/tmp/actualizacion.json "$DOKPLOY_API_URL/api/application.update" > /dev/null

          # Y se vuelve a leer para comprobar que **surtió efecto**. Es el paso que
          # convierte «creo que Dokploy acepta este campo» en un hecho comprobado en cada corrida:
          # si un día la API cambia de forma —o si el método vuelve a estar mal—, esto se pone rojo
          # en vez de desplegar la fecha de ayer
          # con toda la pinta de haber funcionado.
          despues="$(curl -sSf -H "x-api-key: $DOKPLOY_API_KEY" \
            "$DOKPLOY_API_URL/api/application.one?applicationId=$DOKPLOY_WEB_APP_ID")"

          # (a) Lo que queríamos escribir, se escribió.
          #
          # Ojo con el reflejo de «estaba rojo, le doy a re-run»: en una SEGUNDA corrida del mismo
          # día este check se cumple solo, porque `BUILD_DATE=hoy` ya está guardado de la primera.
          # No llega a producción —si ya está guardado, el build hornea hoy igualmente, y el último
          # paso espera a que el dominio publique la fecha— pero el camino de ESCRITURA solo se
          # verifica de verdad en la primera corrida del día. Un re-run no lo re-verifica.
          if ! printf '%s\n' "$(printf '%s' "$despues" | jq -r '.buildArgs // ""')" \
              | grep -qx "BUILD_DATE=$HOY"; then
            echo "::error::El build arg BUILD_DATE=$HOY no quedó guardado en Dokploy; sin él el build reutilizaría la capa cacheada y el sitio publicaría la fecha de ayer."
            exit 1
          fi

          # (b) Y NADA MÁS cambió. Esto es lo que convierte la asunción «update es parcial» en algo
          # comprobado en cada corrida en vez de en una esperanza: si el endpoint resultara ser un
          # reemplazo, la configuración habría desaparecido y el job se pone rojo ANTES de desplegar,
          # con el estropicio aún reparable desde la ficha que guardamos arriba.
          #
          # Se compara por COMPLEMENTO y no con una lista blanca de campos. Una lista blanca es la
          # forma equivocada para preguntar «¿se borró algo que NO nombramos?»: solo ve lo que
          # alguien se acordó de escribir. Con `del(...)` entran solos los que nadie listó — y ahí
          # está `githubId`, que la gotcha 1 del heartbeat del 2026-08-21 nombra como imprescindible
          # para clonar el repo privado: sin él el build muere con `could not read Username`, y una
          # lista blanca lo habría dejado pasar en verde.
          #
          # Lo que se excluye, y por qué:
          #  · `buildArgs` es lo que acabamos de cambiar a propósito.
          #  · `applicationStatus` es estado de EJECUCIÓN, no configuración: un despliegue
          #    concurrente (autodeploy por push, o un humano en el panel) lo mueve entre las dos
          #    lecturas y daría un rojo diciendo una mentira. Un rojo por el motivo equivocado
          #    tampoco es un gate.
          #  · `updatedAt`/`refreshToken` cambian solos en cada escritura.
          #
          # Y una advertencia para el primer rojo, que puede no ser el que esperas: `jq -S` ordena
          # CLAVES, no elementos de array, y esta comparación abarca todos los arrays de la ficha
          # (`domains`, `mounts`, `ports`, `redirects`, `security`). Si Dokploy devolviera alguno en
          # otro orden, esto salta sin que nadie haya borrado nada. Se acepta a propósito: falla en
          # ROJO y ANTES de desplegar, que es la dirección segura, y nombra el campo — así que la
          # primera corrida real contra el panel dirá en un minuto si hay algo más que excluir. Si
          # el primer rojo es un `domains` reordenado, no es un reemplazo: es esto.
          if ! diff -q \
              <(printf '%s' "$antes"   | jq -S 'del(.buildArgs, .applicationStatus, .updatedAt, .refreshToken)') \
              <(printf '%s' "$despues" | jq -S 'del(.buildArgs, .applicationStatus, .updatedAt, .refreshToken)') \
              > /dev/null; then
            # SOLO LOS NOMBRES. La ficha de Dokploy trae `env` EN CLARO —AEMET_API_KEY incluida— y
            # los logs de Actions son legibles; GitHub enmascara los secretos del repo, no los que
            # viven en el panel. Así que se dice QUÉ campo cambió y nunca su valor.
            cambiados="$(jq -n \
              --argjson a "$(printf '%s' "$antes"   | jq 'del(.buildArgs, .applicationStatus, .updatedAt, .refreshToken)')" \
              --argjson d "$(printf '%s' "$despues" | jq 'del(.buildArgs, .applicationStatus, .updatedAt, .refreshToken)')" \
              -r '(($a|keys) + ($d|keys) | unique) | map(select($a[.] != $d[.])) | join(", ")')"
            echo "::error::application.update NO es parcial: al escribir buildArgs cambió también la configuración de la aplicación (campos afectados: ${cambiados:-varios}). NO se imprimen los valores porque la ficha trae las variables de entorno en claro. La aplicación viva puede haber perdido configuración; restaura desde el panel antes de volver a correr esto."
            exit 1
          fi

      - name: Desplegar
        run: |
          set -eu
          curl -sSf -X POST -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            --data "{\"applicationId\":\"$DOKPLOY_WEB_APP_ID\"}" \
            "$DOKPLOY_API_URL/api/application.deploy" > /dev/null

      - name: Comprobar que el sitio publica ya el día de hoy
        env:
          HOY: ${{ steps.fecha.outputs.hoy }}
        run: |
          set -eu
          # Lo que se comprueba es el RESULTADO, no que la llamada de despliegue devolviera 200:
          # «se pidió un despliegue» y «el sitio publica hoy» son cosas distintas, y la segunda es
          # la que le importa a quien lo visita.
          intento=1
          while [ "$intento" -le 20 ]; do
            html="$(curl -sS --max-time 20 "$SITIO$PAGINA_TESTIGO" || true)"
            if printf '%s' "$html" | grep -q "data-otro-dia-build=\"$HOY\""; then
              echo "El sitio publica $HOY (intento $intento)."
              exit 0
            fi
            echo "Todavía no ($intento/20); se reintenta en 30 s."
            sleep 30
            intento=$((intento + 1))
          done
          publicado="$(printf '%s' "${html:-}" | grep -o 'data-otro-dia-build="[^"]*"' | head -1)"
          echo "::error::Diez minutos después del despliegue, $SITIO$PAGINA_TESTIGO sigue sin publicar $HOY (lo último leído: ${publicado:-nada}). El portal está sirviendo un día que no es hoy."
          exit 1
