# Servidor estático de la web de Mareía (T-17).
#
# Sustituye ENTERO al `nginx.conf` de la imagen oficial en vez de añadir un fichero en `conf.d/`:
# así no queda debajo un `server` por defecto en el 80 ni directivas que nadie de este proyecto ha
# leído. Aquí no hay proxy ni upstreams: solo el `dist/` que dejó Astro.

# No hay directiva `user`: el contenedor ya corre como `nginx` (USER en el Dockerfile) y esa
# directiva solo tiene sentido con un master root — dejarla puesta solo imprimiría un aviso en cada
# arranque, que es ruido en el sitio donde luego hay que buscar averías.
worker_processes  auto;

# `/run` es de root y el master no lo es. El pid se guarda donde el usuario puede escribir.
pid /tmp/nginx.pid;

# El log del contenedor ES el log: es lo que lee Dokploy. Nada de ficheros dentro de la imagen,
# que nadie iría a buscar y que crecen hasta llenar la capa de escritura.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout combined;

    sendfile on;
    keepalive_timeout 65;

    # La versión exacta de nginx no le hace falta a nadie de fuera y sí a quien busca un CVE que
    # probar contra el portal.
    server_tokens off;

    server {
        # 0.0.0.0 EXPLÍCITO, y no `listen 3000` a secas: aunque nginx ya escucha en todas las
        # interfaces por defecto, esta línea es la que el arranque lee y publica en el log. La
        # avería que esto previene es la que ya se ha visto: un servidor que bindea al hostname del
        # contenedor arranca sin quejarse, el contenedor queda `running`, y Traefik devuelve 502.
        listen 0.0.0.0:3000;
        server_name _;

        root /usr/share/nginx/html;

        # El sitio son directorios con su `index.html` (`trailingSlash: "always"` en astro.config).
        index index.html;

        # Sin esto, la redirección de `/mareas/…/vigo` a `/mareas/…/vigo/` sale con un `Location`
        # absoluto construido con el host y el PUERTO INTERNO (`http://…:3000/…`), que detrás de
        # Traefik manda al visitante a una dirección que desde fuera no existe. Relativa siempre.
        absolute_redirect off;

        # No hay `try_files`, y es deliberado: sin él, una URL que no existe cae en el 404 de
        # abajo. Un `try_files … /index.html` (el catch-all de las SPA) devolvería la portada con
        # un 200 y le diría a Google que cada URL inventada es una página real del portal. Este
        # sitio es SSG y su motivo de existir es el SEO: el 404 tiene que ser un 404.
        error_page 404 /404.html;
        location = /404.html {
            # `internal`: la página de error no es una URL del portal, solo se llega a ella
            # fallando. Así no existe en dos sitios.
            internal;
        }
    }
}
